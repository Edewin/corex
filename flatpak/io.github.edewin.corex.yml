app-id: io.github.edewin.corex
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.10'
command: corex

cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

finish-args:
  # the floating widget needs X11 to be moved and kept above other windows
  - --socket=x11
  - --share=ipc
  # GPU counters (NVIDIA NVML, AMD/Intel sysfs)
  - --device=all
  # temperatures, fans, voltages, disks and network counters
  - --filesystem=/sys:ro
  # network counters of the real interfaces (CoreX itself never connects anywhere)
  - --share=network

modules:
  - generated-sources.json

  - name: corex
    buildsystem: simple
    sources:
      - type: dir
        path: ..
    build-commands:
      - pip3 install --no-index --find-links . --prefix=/app --no-build-isolation --no-deps .
      - install -Dm644 io.github.edewin.corex.desktop /app/share/applications/io.github.edewin.corex.desktop
      - install -Dm644 corex/assets/corex_icon.svg /app/share/icons/hicolor/scalable/apps/io.github.edewin.corex.svg
      - install -Dm644 io.github.edewin.corex.metainfo.xml /app/share/metainfo/io.github.edewin.corex.metainfo.xml
